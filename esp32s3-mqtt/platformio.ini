; XIAO ESP32-S3 telemetry node: BME280 + SGP41 over WiFi to the LouisianAir broker.
;
; Credentials come from the environment so nothing secret lands in git. Export them
; (or source .env) before building:
;   WIFI_SSID WIFI_PASS MQTT_ADDR MQTT_USER MQTT_PASS [MQTT_DEVICE MQTT_TOPIC]

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; The S3 talks over native USB CDC, so serial output needs it compiled in and
; the port has to re-enumerate after each flash.
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DWIFI_SSID='"${sysenv.WIFI_SSID}"'
	-DWIFI_PASS='"${sysenv.WIFI_PASS}"'
	-DMQTT_ADDR='"${sysenv.MQTT_ADDR}"'
	-DMQTT_USER='"${sysenv.MQTT_USER}"'
	-DMQTT_PASS='"${sysenv.MQTT_PASS}"'
	-DMQTT_DEVICE='"${sysenv.MQTT_DEVICE}"'
	-DMQTT_TOPIC='"${sysenv.MQTT_TOPIC}"'

lib_deps =
	knolleary/PubSubClient@^2.8
	sensirion/Sensirion I2C SGP41@^1.0.0
	adafruit/Adafruit BME280 Library@^2.2.4
	adafruit/Adafruit Unified Sensor@^1.1.14
	sensirion/Sensirion Gas Index Algorithm@^3.2.3
